apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alluxio-worker
  namespace: alluxio-system
spec:
  selector:
    matchLabels:
      app: alluxio-worker
  template:
    metadata:
      labels:
        app: alluxio-worker
    spec:
      serviceAccountName: alluxio
      hostname: alluxio-worker
      subdomain: alluxio-worker
      containers:
      - name: alluxio-worker
        image: alluxio/alluxio:2.9.3
        command: ["/bin/bash", "-c"]
        args:
          - |
            # Configurar variables de entorno para S3
            export AWS_ACCESS_KEY_ID=$(cat /etc/alluxio/credentials/accessKey)
            export AWS_SECRET_ACCESS_KEY=$(cat /etc/alluxio/credentials/secretKey)
            export ALLUXIO_UNDERFS_S3_ACCESS_KEY=$AWS_ACCESS_KEY_ID
            export ALLUXIO_UNDERFS_S3_SECRET_KEY=$AWS_SECRET_ACCESS_KEY
            # Usar nombre de host fijo en lugar de hostname dinámico
            export ALLUXIO_WORKER_HOSTNAME=alluxio-worker.${POD_NAMESPACE}.svc.cluster.local
            /entrypoint.sh worker
        env:
        - name: ALLUXIO_WORKER_RAMDISK_SIZE
          value: "1GB"
        - name: ALLUXIO_MASTER_HOSTNAME
          value: "alluxio-master.alluxio-system.svc.cluster.local"
        - name: ALLUXIO_UNDERFS_S3_ENDPOINT
          value: "s3.us-east-1.amazonaws.com"
        - name: ALLUXIO_UNDERFS_S3_DISABLE_DNS_BUCKETS
          value: "true"
        # Agregar variables AWS estándar
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: alluxio-s3-credentials
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: alluxio-s3-credentials
              key: secretKey
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: alluxio-config
          mountPath: /opt/alluxio/conf/alluxio-site.properties
          subPath: alluxio-site.properties
        - name: s3-credentials
          mountPath: /etc/alluxio/credentials
          readOnly: true
        - name: ramdisk
          mountPath: /dev/shm
        securityContext:
          privileged: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command: ["/bin/bash", "-c", "alluxio fsadmin report || exit 1"]
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 30
      volumes:
      - name: alluxio-config
        configMap:
          name: alluxio-config
      - name: s3-credentials
        secret:
          secretName: alluxio-s3-credentials
      - name: ramdisk
        hostPath:
          path: /dev/shm
          type: Directory